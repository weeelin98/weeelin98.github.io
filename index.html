<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>Little City</title>
  </head>
  <body>
    <canvas id="city" aria-label="3D 微缩街区。左键拖动旋转，右键拖动平移，滚轮缩放。" tabindex="0"></canvas>
    <div id="hover-label" role="status" hidden></div>
    <nav class="environment" aria-label="场景环境">
      <button data-weather="sunny" aria-pressed="true"><span aria-hidden="true">☀</span>Sunny</button>
      <button data-weather="rain" aria-pressed="false"><span aria-hidden="true">☂</span>Rain</button>
      <button data-weather="night" aria-pressed="false"><span aria-hidden="true">☾</span>Night</button>
      <div class="control-divider" aria-hidden="true"></div>
      <button id="pause-animation" aria-pressed="false" aria-label="暂停动画" title="暂停人物、车辆和雨滴"><span class="pause-icon" aria-hidden="true">Ⅱ</span><span class="pause-text">Pause</span></button>
    </nav>
    <dialog id="content-panel" aria-labelledby="panel-title" aria-describedby="panel-description">
      <button class="close" aria-label="关闭内容面板" title="关闭 · Esc">×</button>
      <div class="panel-mark" aria-hidden="true">↗</div>
      <p id="panel-region"></p>
      <h1 id="panel-title"></h1>
      <p id="panel-description"></p>
      <div class="placeholder"><span aria-hidden="true">▤</span><p>这个入口已就绪。<br>完整内容页面将在后续加入。</p></div>
      <button class="continue">继续逛逛 <span aria-hidden="true">↗</span></button>
    </dialog>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
